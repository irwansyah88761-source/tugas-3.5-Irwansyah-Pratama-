<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova.AI - Future Technology</title>

    <!-- PENGATURAN DARK MODE TAILWIND -->
    <script>
        tailwind = {
            config: {
                darkMode: 'class'
            }
        };
    </script>

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MENGINGAT TEMA YANG DIPILIH -->
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-white transition-colors duration-300">

    
<!-- TAHAP 2: NAVBAR -->

<nav class="sticky top-0 z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors duration-300">

    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <!-- LOGO -->
        <a href="#home" class="text-2xl font-bold text-blue-700 dark:text-cyan-400">
            TechNova<span class="text-purple-600 dark:text-purple-400">.AI</span>
        </a>

        <!-- MENU DESKTOP -->
        <div class="hidden md:flex items-center gap-8 font-medium">

            <a href="#home" class="hover:text-blue-600 dark:hover:text-cyan-400">Home</a>

            <a href="#about" class="hover:text-blue-600 dark:hover:text-cyan-400">About</a>

            <a href="#features" class="hover:text-blue-600 dark:hover:text-cyan-400">Features</a>

            <a href="#pricing" class="hover:text-blue-600 dark:hover:text-cyan-400">Pricing</a>

            <a href="#contact" class="hover:text-blue-600 dark:hover:text-cyan-400">Contact</a>

        </div>

        <!-- TOMBOL TEMA DAN HAMBURGER -->
        <div class="flex items-center gap-3">

            <!-- DARK MODE / LIGHT MODE -->
            <button id="themeBtn"
                type="button"
                class="text-2xl p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                aria-label="Ganti tema">
                🌙
            </button>

            <!-- HAMBURGER -->
            <button id="menuBtn"
                type="button"
                class="md:hidden text-3xl text-blue-700 dark:text-white"
                aria-label="Buka menu"
                aria-expanded="false">
                ☰
            </button>

        </div>

    </div>

    <!-- MENU MOBILE -->
    <div id="mobileMenu"
        class="hidden md:hidden bg-blue-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-6 py-5 space-y-4">

        <a href="#home" class="block hover:text-blue-600 dark:hover:text-cyan-400">Home</a>

        <a href="#about" class="block hover:text-blue-600 dark:hover:text-cyan-400">About</a>

        <a href="#features" class="block hover:text-blue-600 dark:hover:text-cyan-400">Features</a>

        <a href="#pricing" class="block hover:text-blue-600 dark:hover:text-cyan-400">Pricing</a>

        <a href="#contact" class="block hover:text-blue-600 dark:hover:text-cyan-400">Contact</a>

    </div>

</nav>

<!-- AKHIR TAHAP 2 -->
    

</body>

</html>
