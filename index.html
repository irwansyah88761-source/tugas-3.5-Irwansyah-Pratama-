<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova.AI - Future Technology</title>

    <!-- PENGATURAN DARK MODE TAILWIND -->
    <script>
        tailwind = {
            config: {
                darkMode: 'class'
            }
        };
    </script>

    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MENGINGAT TEMA YANG DIPILIH -->
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-white transition-colors duration-300">

    <!-- TAHAP SELANJUTNYA AKAN DITAMBAHKAN DI SINI -->

</body>

</html>
